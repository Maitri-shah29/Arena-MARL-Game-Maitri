# Train hiders (team 0) and seekers (team 1).
# Editor workflow: open the Training scene, start the trainer from the repo root:
#
#   mlagents-learn "Unity Project/config/arena_train.yaml" --run-id arena_player
#
# Then press Play in Unity. With no layout argument the Training scene generates arenas.
# To train on a saved player arena, build with ONLY the Training scene enabled,
# then run this from the repo root:
#   mlagents-learn "Unity Project/config/arena_train.yaml" --run-id arena_player_layout --env "<path to Training executable>" --env-args "layout=<full path to Unity Project/config/player_layout.json>"
# --env-args is passed to a standalone executable, not an already open editor.
# Test scene saves player_layout.json when a build phase ends.
behaviors:
  HideAndSeekAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
